<!DOCTYPE html>
<!-- This is the main page of the IFRAME -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arninis Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #DBEAFE;
        }

        /* Main container */
        .container {
            display: flex;
            height: 85vh;
        }

        /* Left column - Navigation */
        .menu {
            width: 35%;
            background-color: #1E3A8A;
            padding: 20px;
            box-sizing: border-box;
        }

        .menu h2 {
            color: white;
        }

        .menu h2:first-child {
            font-size: 30px;
        }

        .menu h2:nth-child(2) {
            font-size: 18px;
            color: #BFDBFE;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 20px;
            margin-bottom: 15px;
            background-color: #2563EB;
            border-radius: 10px;
            font-size: 20px;
            box-sizing: border-box;
        }

        .menu a:hover {
            background-color: #3B82F6;
        }

        /* Right column - Content */
        .content {
            width: 65%;
            background-color: #DBEAFE;
        }

        .content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .ContHeader { /* i've added a header here -just edit */
            margin-block: 0;
            color: #FFFFFF;
            padding: 25px;
            width: 100%;
            height: 15vh;
            box-sizing: border-box;
            text-align: left;
            background-color: #172554;
        }

        .ContHeader h1 {
            font-size: 38px;
            margin: 5px 0 40px;
        }

        .ContHeader p {
            color: #BFDBFE;
            font-size: 20px;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="ContHeader">  <!-- header area  here -->
       <h1> ARNINIS SAMPLE WEBSITE!!!! </h1>
       <p>just my humble creation</p>
    </div>
    <div class="container">

        <!-- LEFT COLUMN -->
        <div class="menu">
            <h2>Navigation</h2>
            <h2>[Adrian Pelle Arnon]</h2>

            <a href="home.html" target="contentFrame">Home</a>
            <a href="autobiography.html" target="contentFrame">About My Self</a>
            <a href="Gallery.html" target="contentFrame">Gallery</a>
            <a href="Contacts.html" target="contentFrame">Contact</a>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="content">
            <iframe
                src="home.html"
                name="contentFrame"
                title="Page Content">
            </iframe>
            
        </div>

    </div>

</body>
</html>
